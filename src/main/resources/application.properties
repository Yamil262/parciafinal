spring.application.name=parciafinal
server.port=${PORT:8080}

# --- Base de datos: en Render se leen de variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parciafinal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Las tablas se crean/actualizan solas a partir de las entidades JPA.
# Solo para el primer despliegue sobre una base con tablas viejas: DDL_AUTO=create (luego quitar la variable).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger UI: /swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Los datos del DBF se cargan una sola vez si la BD esta vacia (ver SeedDataLoader)
parciafinal.seed.enabled=${SEED_ENABLED:true}

# CORS: origenes permitidos (frontend). En Render puede cambiarse con CORS_ORIGINS.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,https://*.github.io}
