spring.application.name=parciafinal
server.port=${PORT:8080}

spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Base de datos: en Render se leen de variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parciafinal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Carga de datos desde los DBF (carpeta resources/seed). Solo llena tablas vacías.
vsiaf.seed.enabled=${VSIAF_SEED_ENABLED:true}
# Unidad 143/SIS + oficinas, responsables y 6 activos de ejemplo. Pon VSIAF_SEED_DEMO=false para no crearlos.
vsiaf.seed.demo=${VSIAF_SEED_DEMO:true}
